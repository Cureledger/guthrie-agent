# Railway service config for the Guthrie PKU research agent (FastAPI).
#
# In Railway, leave the service Root Directory empty: this file, the Dockerfile
# path, and the Docker build context are all resolved from the repo root.
#
# Required variables (Railway service Variables):
#   ANTHROPIC_API_KEY   — funded key on a workspace with model access (runtime)
#   GUTHRIE_API_TOKEN   — the secret the Phebe API sends; without it every
#                         /api/* request is refused
# Optional:
#   GUTHRIE_ANSWER_MODEL      (default claude-haiku-4-5-20251001)
#   GUTHRIE_RATE_LIMIT_PER_MIN(default 60, all members together)

[build]
builder = "dockerfile"
dockerfilePath = "serve/Dockerfile"

[deploy]
# No startCommand: Railway runs it without a shell, so `${PORT:-8000}` would be
# passed to uvicorn as a literal string. Instead the image CMD (shell form in
# serve/Dockerfile) binds uvicorn to Railway's $PORT.
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
