name: Build PKU index

# Rebuilds the Guthrie research index from public sources (PubMed E-utilities
# and Europe PMC — NO API key required) and publishes it as the `index-latest`
# GitHub Release asset. The agent's Docker image (Dockerfile) downloads that asset at
# build time, so the ~40MB binaries never live in git.
#
# Run this ONCE (Run workflow) before the first Railway deploy, then it refreshes
# weekly and whenever the build scripts change.

on:
  workflow_dispatch:
    inputs:
      max_records:
        description: "Records to ADD this run (grows the accumulated corpus; 0 = all remaining)"
        default: "4000"
        required: false
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  push:
    branches: [main]
    paths:
      - "build/**"

permissions:
  contents: write # create/update the index-latest release

concurrency:
  group: build-pku-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The first run after full text arrived checks ~8,000 papers on Europe PMC;
    # later runs only look at papers they have not checked.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The commons layer is cut from five documents in the public pku-commons
      # repo; only those are checked out.
      - name: Check out the PKU Commons documents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Cureledger/pku-commons
          path: pku-commons
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /benchmark/BENCHMARK.md
            /benchmark/leaderboard.md
            /docs/PEER-REVIEW.md
            /docs/pain-points.md

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install build deps
        run: pip install --no-cache-dir numpy "sentence-transformers>=2.7" "rank_bm25>=0.2.2"

      - name: Restore accumulated corpus (from index-latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/raw
          # Pull the corpus we've grown so far so this run ADDS to it. First run
          # (no release / no asset yet) just starts fresh.
          gh release download index-latest --dir build/raw \
            --pattern 'literature.jsonl.gz' --pattern 'fetched_ids.txt' \
            --pattern 'literature_pterin.jsonl.gz' --pattern 'fetched_ids_pterin.txt' \
            --pattern 'fulltext.jsonl.gz' --pattern 'fulltext_ids.txt' \
            --pattern 'fulltext_failed.txt' --clobber \
            || echo "no prior corpus — starting fresh"
          for f in build/raw/*.jsonl.gz; do if [ -f "$f" ]; then gunzip -f "$f"; fi; done
          echo "restored $(wc -l < build/raw/literature.jsonl 2>/dev/null || echo 0) PKU records, $(wc -l < build/raw/literature_pterin.jsonl 2>/dev/null || echo 0) pterin records, $(wc -l < build/raw/fulltext.jsonl 2>/dev/null || echo 0) full texts"

      - name: Fetch corpus (PubMed, key-free)
        env:
          NCBI_CONTACT_EMAIL: ${{ vars.NCBI_CONTACT_EMAIL }}
          # Dispatch input goes through env, never into the script text.
          MAX_RECORDS: ${{ github.event.inputs.max_records || '4000' }}
        run: |
          python build/fetch_corpus.py --max "$MAX_RECORDS"
          # Layer 1b: the pterin (BH4) and monoamine-synthesis disorders
          python build/fetch_corpus.py --slice pterin --max "$MAX_RECORDS"
          # papers reviewed in that the universe queries do not match (CORPUS.md)
          python build/fetch_corpus.py --pmids build/supplemental_pmids.txt

      - name: Fetch open-access full text (Europe PMC, key-free)
        # Checkpoints after every 100 papers and resumes next run, so a failure
        # here still builds the index with the full text already held.
        run: python build/fetch_fulltext.py || echo "full-text fetch stopped early; building with what is held"

      - name: Fetch guideline full text (best-effort)
        run: python build/fetch_guidelines_fulltext.py || echo "guidelines fetch skipped/failed; continuing with the literature corpus"

      - name: Build commons layer (from the pku-commons documents)
        env:
          PKU_COMMONS_DIR: ${{ github.workspace }}/pku-commons
        run: |
          python build/build_market_layer.py
          # The documents come from another repo: stop if none were found,
          # so the index never quietly loses the commons layer.
          test -s build/raw/market.jsonl

      - name: Build index
        run: python build/build_index.py

      - name: Package
        run: |
          test -f pku_index/chunks.sqlite
          tar czf pku_index.tar.gz pku_index
          # keep the grown corpus + attempted-id logs so the next run resumes it
          for f in literature literature_pterin fulltext; do
            if [ -f "build/raw/$f.jsonl" ]; then gzip -kf "build/raw/$f.jsonl"; fi
          done
          touch build/raw/fetched_ids_pterin.txt build/raw/fulltext_ids.txt build/raw/fulltext_failed.txt
          ls -la pku_index.tar.gz build/raw/*.jsonl.gz build/raw/*.txt
          echo "---- meta.json ----"
          cat pku_index/meta.json

      - name: Publish index-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS="pku_index.tar.gz $(ls build/raw/*.jsonl.gz) build/raw/fetched_ids.txt build/raw/fetched_ids_pterin.txt build/raw/fulltext_ids.txt build/raw/fulltext_failed.txt"
          NOTES="PKU retrieval index + accumulated corpus, rebuilt $(date -u +%Y-%m-%dT%H:%M:%SZ) from PubMed, Europe PMC full text and guidelines. Docker pulls pku_index.tar.gz; the Build-PKU-index Action reuses the corpus files and id logs to grow the corpus each run."
          if gh release view index-latest >/dev/null 2>&1; then
            gh release upload index-latest $ASSETS --clobber
            gh release edit index-latest --notes "$NOTES"
          else
            gh release create index-latest $ASSETS \
              --title "PKU index (latest)" \
              --notes "$NOTES" \
              --prerelease
          fi
